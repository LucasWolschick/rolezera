name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Set environment variables
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          echo "USERNAME=$(printf '%s' "$GHCR_USERNAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | \
          podman login ghcr.io -u "$USERNAME" --password-stdin

      - name: Build image
        run: |
          podman build --platform linux/arm64 -t "ghcr.io/$USERNAME/rolezera:latest" .

      - name: Push image
        run: |
          podman push "ghcr.io/$USERNAME/rolezera:latest"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        env:
          USERNAME: ${{ env.USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: USERNAME,GHCR_TOKEN
          script: |
            set -Eeuo pipefail
            
            echo "$GHCR_TOKEN" | podman login ghcr.io \
              -u "$USERNAME" \
              --password-stdin
            
            podman pull "ghcr.io/$USERNAME/rolezera:latest"

            # apply migrations
            podman run --rm \
              --env-file ~/.rails-env \
              -v rails-data:/rails/storage \
              "ghcr.io/$USERNAME/rolezera:latest" \
              bin/rails db:migrate

            # start new version of the app
            podman stop rails || true
            podman rm rails || true
            
            podman run -d \
              --name rails \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file ~/.rails-env \
              -v rails-data:/rails/storage \
              --replace \
              "ghcr.io/$USERNAME/rolezera:latest" \
              ./bin/rails server -p 3000 -b 0.0.0.0

            podman logout ghcr.io
