name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          echo "USERNAME=$(printf '%s' "$GHCR_USERNAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | \
          podman login ghcr.io -u "$USERNAME" --password-stdin

      - name: Build image
        run: |
          podman build -t "ghcr.io/$USERNAME/rolezera:latest" .

      - name: Push image
        run: |
          podman push "ghcr.io/$USERNAME/rolezera:latest"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        env:
          USERNAME: ${{ env.USERNAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: USERNAME
          script: |
            podman pull "ghcr.io/$USERNAME/rolezera:latest"
            podman stop rails || true
            podman rm rails || true
            podman run -d \
              --name rails \
              -p 3000:3000 \
              --env-file ~/.rails-env \
              "ghcr.io/$USERNAME/rolezera:latest"
